version: '3.8'

services:
  quality-dashboard:
    build: .
    container_name: quality-visualization
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ENABLE_CORS=false
    restart: unless-stopped
    networks:
      - quality-network

  # Optional: Add nginx reverse proxy for HTTPS and authentication
  nginx:
    image: nginx:alpine
    container_name: quality-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - quality-dashboard
    restart: unless-stopped
    networks:
      - quality-network
    profiles:
      - production

networks:
  quality-network:
    driver: bridge
